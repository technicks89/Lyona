# The system user lyona-update-root builds dwm as (#336, decision D-36): dwm
# is the one program that includes the updating user's config.h, so it is
# never compiled as root, and not as the shared nobody either, which any
# process already running as nobody could write to. Nothing else runs as this
# account: it has no home, no shell and no password. install-system installs
# this file and runs systemd-sysusers on it; a staged install leaves that to
# the next boot.
u lyona-build - "lyona update build" /nonexistent /usr/bin/nologin
