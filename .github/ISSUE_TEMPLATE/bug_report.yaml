name: "Bug report"
description: "Report a bug to help us identify and fix issues in the project."
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private keys, or other secrets. Report
        security issues privately using the instructions in `SECURITY.md`.

  - type: textarea
    id: issue_description
    attributes:
      label: Provide a clear and concise description of the issue.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the release version or `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: input
    id: last_update
    attributes:
      label: Date of last full system update (pacman -Syu)
      description: Arch Linux is a rolling release; this helps identify package-version drift.
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: As `uname -m` prints it.
      options:
        - x86_64
        - aarch64
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine or board
      description: |
        On a Raspberry Pi, `cat /sys/firmware/devicetree/base/model`. On a PC,
        laptop or other UEFI machine, `cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name`.
        For a virtual machine, the host and the hypervisor. Add the GPU when the
        issue is graphical.
      placeholder: "Dell Inc. XPS 13 9345"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installed from
      options:
        - The x86_64 installer image
        - The generic aarch64 image
        - The Raspberry Pi image
        - install.sh on an existing system
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Kernel and session
      description: "`uname -r`, and how the session starts."
      placeholder: "7.3.3-1-aarch64-ARCH, X11 via LightDM"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "List the smallest reliable sequence that reproduces the issue."
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Relevant diagnostics
      description: Include bounded logs and `dwm-diagnostics` output when applicable.
      placeholder: "Paste text directly; attach screenshots only when the issue is visual."

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials and unrelated personal data.
          required: true
        - label: I checked for an existing issue describing the same problem.
          required: true
