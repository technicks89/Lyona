name: Promote release

# Run by hand, once a main release has been qualified (docs/RELEASING.md): it
# makes the named pre-release that build-iso.yml published a normal release,
# and the latest one unless a newer stable release already is. Only main
# releases (a stable vYYYY.MM.PATCH tag) are promoted; beta releases (-alpha,
# -beta, -rc) stay pre-releases. Only the repository's admins and maintainers
# can run it (the authorize job).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The main release to promote (e.g. v2026.10.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  # Only the repository's admins and maintainers may release. Whoever started
  # the run is asked about, through the API, so this follows the collaborator
  # list as it changes; anyone else is refused before anything else runs.
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Allow only admins and maintainers
        run: |
          set -euo pipefail
          role=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .role_name) || {
            echo "::error::Could not look up $ACTOR's permission on $GH_REPO."
            exit 1
          }
          case $role in
          admin | maintain) echo "$ACTOR is a repository $role; allowed." ;;
          *)
            echo "::error::Only the repository's admins and maintainers can run this; $ACTOR is a repository ${role:-collaborator of unknown role}."
            exit 1
            ;;
          esac

  promote:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Promote the release
        run: |
          set -euo pipefail
          [[ $TAG =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || {
            echo "::error::$TAG is not a main release tag (vYYYY.MM.PATCH); beta releases stay pre-releases."
            exit 1
          }
          release=$(gh release view "$TAG" --json isPrerelease,isDraft,publishedAt \
            --jq '[.isPrerelease, .isDraft, .publishedAt] | @tsv') || {
            echo "::error::There is no release for $TAG."
            exit 1
          }
          IFS=$'\t' read -r prerelease draft published <<<"$release"
          if [[ $draft == true ]]; then
            echo "::error::$TAG is still a draft; publish it first."
            exit 1
          fi
          if [[ $prerelease != true ]]; then
            echo "$TAG is already a normal release; nothing to do."
            exit 0
          fi
          # The latest only when no newer stable release already is. GitHub
          # answers 404 when there is no stable release yet; any other failure
          # stops here, before the edit could wrongly mark this one latest.
          make_latest=true
          if latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .published_at 2>latest.err); then
            if [[ -n $latest ]] && (($(date -u -d "$latest" +%s) > $(date -u -d "$published" +%s))); then
              make_latest=false
            fi
          elif ! grep -Fq 'HTTP 404' latest.err; then
            echo "::error::Could not look up the latest release: $(cat latest.err)"
            exit 1
          fi
          echo "Promoting $TAG (latest: $make_latest)."
          gh release edit "$TAG" --prerelease=false --latest="$make_latest"
