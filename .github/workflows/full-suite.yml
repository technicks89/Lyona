name: Full suite (manual)

# Manual only. The smoke job in c-cpp.yml stays the per-push gate; this is the
# occasional "run everything on a clean Arch container" check that replaced
# nothing and blocks nothing.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "make target to run (default: the whole suite)"
        type: string
        default: check
      clang:
        description: "Also build dwm with clang"
        type: boolean
        default: true
      aarch64:
        description: "Also run on aarch64 (Arch Linux ARM; experimental)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: make ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:base-devel
      # Several acceptance tests create private namespaces, a private system
      # bus, and nested Xvfb displays.
      options: >-
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    defaults:
      run:
        shell: bash
    env:
      DWM_TEST_TMP_ROOT: /var/tmp/lyona-ci

    steps:
      - name: Install checkout dependency
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: tests/test-shell-contracts.sh checks that each
          # retired document a commit is cited for is in that commit.
          fetch-depth: 0

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate the target name
        env:
          TARGET: ${{ inputs.target }}
        run: |
          # Keep workflow input out of the shell grammar: one make target name.
          [[ $TARGET =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "invalid target: $TARGET" >&2; exit 2; }

      - name: Install full validation dependencies
        run: |
          source scripts/dwm-packages.sh
          mapfile -t packages < <(dwm_packages arch ci-full | awk 'NF' | sort -u)
          # The hosted runner may lack some optional entries (for example the
          # multilib gaming packages); install what its repositories have and
          # let the owning tests skip the rest.
          # One database query, not one `pacman -Si` per package (about 20 s).
          mapfile -t available < <(
            LC_ALL=C comm -12 <(pacman -Slq | LC_ALL=C sort -u) \
              <(printf '%s\n' "${packages[@]}" | LC_ALL=C sort -u)
          )
          pacman -S --noconfirm --needed "${available[@]}"

      - name: Prepare unprivileged runner
        run: |
          install -d -m 0700 -o nobody -g nobody /home/dwm-ci /run/dwm-ci "$DWM_TEST_TMP_ROOT"
          chown -R nobody:nobody "$GITHUB_WORKSPACE" "$DWM_TEST_TMP_ROOT"

      - name: Run make ${{ inputs.target }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          runuser -u nobody -- env HOME=/home/dwm-ci XDG_RUNTIME_DIR=/run/dwm-ci SHELL=/bin/bash \
            scripts/run-tests make "$TARGET" 2>&1 | tee /var/tmp/lyona-ci/full-suite.log
          exit "${PIPESTATUS[0]}"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-log
          path: /var/tmp/lyona-ci/full-suite.log
          if-no-files-found: ignore

  # ARM1-05 (decision A-9): the same suite on aarch64, in Arch Linux ARM.
  # Arch Linux ARM has no container image, so the job builds one from its
  # signed root filesystem (scripts/ci-archlinuxarm-image.sh) and runs the suite
  # in it through scripts/ci-local.sh, the local twin of the job above: the
  # same package profile (resolved for aarch64), security options, `nobody`
  # runner and `scripts/run-tests make TARGET`. Manual only until it has been
  # green several times in a row.
  full-suite-aarch64:
    name: make ${{ inputs.target }} (aarch64)
    if: inputs.aarch64
    runs-on: ubuntu-24.04-arm
    # Private repositories get two cores on this runner.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: tests/test-shell-contracts.sh checks that each
          # retired document a commit is cited for is in that commit.
          fetch-depth: 0

      - name: Validate the target name
        env:
          TARGET: ${{ inputs.target }}
        run: |
          [[ $TARGET =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "invalid target: $TARGET" >&2; exit 2; }

      - name: Build the Arch Linux ARM image (signature and checksum checked)
        run: scripts/ci-archlinuxarm-image.sh lyona-archlinuxarm:base-devel

      - name: Run make ${{ inputs.target }} on aarch64
        env:
          TARGET: ${{ inputs.target }}
          CLANG: ${{ inputs.clang }}
        run: |
          export TMPDIR=$RUNNER_TEMP/lyona-ci
          mkdir -p "$TMPDIR"
          clang=()
          [[ $CLANG != true ]] || clang=(--clang)
          # The whole suite runs each target on its own and lists every
          # failure, instead of stopping at the first: what fails on aarch64
          # is what this experimental job is for.
          each=()
          [[ $TARGET != check ]] || each=(--each)
          scripts/ci-local.sh --base-image lyona-archlinuxarm:base-devel "${clang[@]}" "${each[@]}" "$TARGET"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-aarch64-log
          # The whole log directory: --each writes each.log and each/TARGET.log.
          path: ${{ runner.temp }}/lyona-ci/lyona-ci-local.*/
          if-no-files-found: ignore

  display-security:
    name: display helper security (root, disposable container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    env:
      # tests/test-settings-display-security.sh installs and rewrites system
      # paths, so it refuses to run anywhere but a disposable root container.
      DWM_SECURITY_CONTAINER: "1"
    steps:
      - name: Install checkout dependency
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the display helper security test
        run: make check-settings-display-security

      # The same disposable root container suits the System Health root helper
      # (Sync Sprint 12 S12-15).
      - name: Run the system-health helper security test
        run: make check-system-health-root-security

  update-helper-backups:
    name: update helper backups (root, disposable container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
      # An init as PID 1 reaps the processes the test kills. Without one a
      # killed process stays a zombie of its user, and the helper's check for
      # processes left running as lyona-build refuses every later build.
      options: --init
    env:
      # tests/test-lyona-update-root-backups.sh runs lyona-update-root as root and
      # writes system paths, so it refuses to run anywhere but a disposable root
      # container. Part 2 builds and installs a release, so it needs the build
      # dependencies.
      DWM_SECURITY_CONTAINER: "1"
    steps:
      - name: Install checkout dependency
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          source scripts/dwm-packages.sh
          mapfile -t packages < <(dwm_packages arch build | awk 'NF' | sort -u)
          pacman -S --noconfirm --needed "${packages[@]}"

      - name: Run the update helper backup test
        run: make check-update-root-backups

  clang-build:
    name: clang build
    if: inputs.clang
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - name: Install checkout dependency
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang and build dependencies
        run: |
          source scripts/dwm-packages.sh
          mapfile -t packages < <(dwm_packages arch build | awk 'NF' | sort -u)
          pacman -S --noconfirm --needed clang "${packages[@]}"

      - name: Build with clang
        run: make clean all CC=clang
