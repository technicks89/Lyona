name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base-devel
    env:
      DWM_TEST_TMP_ROOT: /var/tmp/lyona-ci

    steps:
      # The image's mirror list can leave one mirror as the only source, and one
      # bad moment on it fails the job before anything is built. More servers let
      # pacman fetch a failed file from the next one, and the installs retry.
      - name: Configure pacman mirrors
        run: |
          {
            printf 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch\n'
            printf 'Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch\n'
            printf 'Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch\n'
            printf 'Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch\n'
          } >/etc/pacman.d/mirrorlist

      - name: Install checkout dependency
        run: |
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed git && exit 0
            echo "pacman failed (attempt $attempt); retrying" >&2
            sleep 15
          done
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build and smoke dependencies
        shell: bash
        run: |
          source scripts/dwm-packages.sh
          mapfile -t packages < <(dwm_packages arch ci-smoke | awk 'NF' | sort -u)
          for attempt in 1 2 3; do
            # Synced and upgraded by the step above: one sync per job (Sync
            # Sprint 16 R16-39).
            pacman -S --noconfirm --needed "${packages[@]}" && exit 0
            echo "pacman failed (attempt $attempt); retrying" >&2
            sleep 15
          done
          exit 1

      - name: Build dwm
        run: |
          scripts/run-tests make clean all
          chmod 0755 dwm

      - name: Launch desktop and check basic interaction
        timeout-minutes: 2
        run: |
          install -d -m 0700 -o nobody -g nobody /home/dwm-ci /run/dwm-ci "$DWM_TEST_TMP_ROOT"
          chown -R nobody:nobody "$GITHUB_WORKSPACE" "$DWM_TEST_TMP_ROOT"
          runuser -u nobody -- env HOME=/home/dwm-ci XDG_RUNTIME_DIR=/run/dwm-ci \
            scripts/run-tests timeout --kill-after=5s 90s tests/test-desktop-smoke-xvfb.sh
