name: Build ISO and release

# Builds the ISO, then creates the release tag and the GitHub release for the
# committed config.mk VERSION through scripts/lyona-release: the source archive
# lyona-update installs from, the ISO, and a SHA256SUMS of both. The tag is
# created at this run's commit, and only after the ISO has built.
#
# - beta: VERSION must carry an -alpha.N, -beta.N or -rc.N suffix. It is
#   published as a pre-release and stays one.
# - main: VERSION must be a plain YYYY.MM.PATCH. It is published as a
#   pre-release, and stays one until promote-releases.yml is run by hand for
#   its tag, once its ISO is qualified (docs/RELEASING.md).
#
# Rerunning for a VERSION already tagged at this commit replaces the assets; a
# VERSION tagged at another commit is refused, so bump config.mk first.
#
# Three jobs after authorize (GHSA-xfhv-7h9c-m966): build-iso builds and checks
# everything, with a read-only token and no way to sign; sign, which runs no
# repository code, attests what build-iso made and is the only job with the
# OIDC token; release publishes the signed files with the admin's token. The
# signature's identity is the workflow file (build-iso.yml on main), whichever
# job signs, so lyona-update's check is unchanged.
#
# The container image is pinned by digest. To update it: docker pull
# archlinux:base-devel, then docker inspect --format '{{json .RepoDigests}}'
# archlinux:base-devel, and replace both digests below.
#
# Who can release: only the repository's admins and maintainers (the authorize
# job). The tag is created with RELEASE_TOKEN, an admin's fine-grained token
# kept as a secret of the "release" environment, which only main can use: the
# "Lock Tags" ruleset lets only admins create tags, and the workflow's own
# token is not one (docs/RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel: beta (a pre-release VERSION such as 2026.10.0-beta.1) or main (a stable VERSION such as 2026.10.0)"
        type: choice
        options:
          - beta
          - main
        required: true
      notes:
        description: "Release notes file in the repository (optional, e.g. docs/RELEASE-NOTES-2026.10.0.md)"
        required: false
        default: ""

# The workflow's own token only reads; the release is created with
# RELEASE_TOKEN (Sync Sprint 16 R16-11).
permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only the repository's admins and maintainers may release. Whoever started
  # the run is asked about, through the API, so this follows the collaborator
  # list as it changes; anyone else is refused before anything else runs.
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Allow only admins and maintainers
        run: |
          set -euo pipefail
          role=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .role_name) || {
            echo "::error::Could not look up $ACTOR's permission on $GH_REPO."
            exit 1
          }
          case $role in
          admin | maintain) echo "$ACTOR is a repository $role; allowed." ;;
          *)
            echo "::error::Only the repository's admins and maintainers can run this; $ACTOR is a repository ${role:-collaborator of unknown role}."
            exit 1
            ;;
          esac

  build-iso:
    needs: authorize
    environment: release
    runs-on: ubuntu-latest
    # Read-only: it runs the repository's code and freshly synced packages, so
    # it can neither sign nor publish (GHSA-xfhv-7h9c-m966).
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    timeout-minutes: 90
    container:
      image: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
      options: --privileged
    # A container job's steps run with sh by default; these use bash's [[ ]],
    # arrays, mapfile and pipefail.
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.event.inputs.channel }}
      NOTES: ${{ github.event.inputs.notes }}
      RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}

    steps:
      # github-cli lands here rather than with the build dependencies below:
      # the version and tag checks run before them, so a bad request fails in
      # seconds instead of after a full archiso install.
      - name: Install checkout and release-query dependencies
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the version and the tag
        id: check
        run: |
          set -euo pipefail
          version=$(awk -F= '$1 ~ /^[[:space:]]*VERSION[[:space:]]*$/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' config.mk)
          case $CHANNEL in
          beta)
            [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]] || {
              echo "::error::A beta release needs a pre-release VERSION in config.mk (such as 2026.10.0-beta.1); it is $version."
              exit 1
            }
            ;;
          main)
            [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || {
              echo "::error::A main release needs a stable VERSION in config.mk (such as 2026.10.0); it is $version."
              exit 1
            }
            ;;
          *)
            echo "::error::Unknown channel: $CHANNEL"
            exit 1
            ;;
          esac
          tag=v$version
          head=$(git rev-parse HEAD)
          # GitHub answers 404 or 422 ("No commit found") for a tag that does not
          # exist; any other failure stops here rather than passing for "no tag".
          if tagged=$(gh api "repos/:owner/:repo/commits/$tag" --jq .sha 2>"$RUNNER_TEMP/tag.err"); then
            if [[ $tagged != "$head" ]]; then
              echo "::error::$tag already exists at ${tagged:0:12}, not this run's ${head:0:12}. Bump VERSION in config.mk to release again."
              exit 1
            fi
            echo "$tag already points at this commit; its release assets will be replaced."
          elif ! grep -Eq 'HTTP (404|422)' "$RUNNER_TEMP/tag.err"; then
            echo "::error::Could not look up $tag: $(cat "$RUNNER_TEMP/tag.err")"
            exit 1
          fi
          if [[ $RELEASE_TOKEN_SET != true ]]; then
            echo "::error::The release environment has no RELEASE_TOKEN secret; see docs/RELEASING.md."
            exit 1
          fi
          if [[ -n $NOTES && ! -f $NOTES ]]; then
            echo "::error::Release notes file not found: $NOTES"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
          } >>"$GITHUB_ENV"
          {
            echo "version=$version"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # shellcheck source=scripts/dwm-packages.sh
          . scripts/dwm-packages.sh
          mapfile -t build < <(dwm_packages arch build)
          # Synced and upgraded with git above: one sync per job (Sync Sprint
          # 16 R16-39).
          # jq: lyona-release reads the signed digests from the bundle.
          pacman -S --noconfirm --needed archiso rsync jq "${build[@]}"

      # Before the admin token is in reach: this builds and runs the release
      # archive's code (Sync Sprint 16 R16-11). lyona-release then skips it.
      - name: Check the release archive
        run: make release-check

      # Outside the checkout: lyona-release requires a clean worktree.
      - name: Build ISO
        run: scripts/build-lyona-arch-iso.sh --output "$RUNNER_TEMP/iso"

      # The ISO and its checksum alone in one directory, uploaded by a
      # single-line path: in a container job the runner maps only the first
      # line of a multi-line path from the host's runner.temp to the
      # container's, so a second line matched nothing and the ISO landed under
      # __w/_temp/iso/ in the artifact, where sign and release did not see it.
      - name: Checksum ISO
        run: |
          set -euo pipefail
          shopt -s nullglob
          iso=("$RUNNER_TEMP"/iso/*.iso)
          ((${#iso[@]} == 1)) || {
            echo "::error::Expected one ISO, found ${#iso[@]}"
            exit 1
          }
          mkdir "$RUNNER_TEMP/iso-artifact"
          mv -- "${iso[0]}" "$RUNNER_TEMP/iso-artifact/"
          cd "$RUNNER_TEMP/iso-artifact"
          sha256sum ./*.iso > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyona-iso-${{ env.TAG }}
          path: ${{ runner.temp }}/iso-artifact
          if-no-files-found: error

      # The source archive "Check the release archive" left, for sign; the
      # release job rebuilds it byte for byte and checks the signature names it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyona-source-${{ env.TAG }}
          path: release/lyona-*.tar.gz
          if-no-files-found: error

  # Signed releases (decision D-31): a build-provenance attestation for the
  # source archive and the ISO, signed keylessly through Sigstore with this
  # run's identity, so there is no signing key to keep. Apart from the build
  # (GHSA-xfhv-7h9c-m966): the only job with the OIDC token, and it runs no
  # repository code, only these pinned actions on build-iso's files.
  sign:
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lyona-iso-${{ needs.build-iso.outputs.tag }}
          path: iso

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lyona-source-${{ needs.build-iso.outputs.tag }}
          path: source

      - name: Sign the release files
        id: sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            iso/*.iso
            source/lyona-*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyona-bundle-${{ needs.build-iso.outputs.tag }}
          path: ${{ steps.sign.outputs.bundle-path }}
          if-no-files-found: error

  # Every release starts as a pre-release: a beta stays one, and a main release
  # stays one until promote-releases.yml is run for it. With the admin's token:
  # the "Lock Tags" ruleset lets only admins create tags.
  release:
    needs: [build-iso, sign]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    container:
      image: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ github.event.inputs.notes }}
      VERSION: ${{ needs.build-iso.outputs.version }}

    steps:
      - name: Install checkout and release dependencies
        run: pacman -Syu --noconfirm --needed git github-cli jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lyona-iso-${{ needs.build-iso.outputs.tag }}
          path: ${{ runner.temp }}/iso

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lyona-bundle-${{ needs.build-iso.outputs.tag }}
          path: ${{ runner.temp }}/bundle

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # An unmatched glob counts as none, not as its own literal text.
          shopt -s nullglob
          iso=("$RUNNER_TEMP"/iso/*.iso)
          ((${#iso[@]} == 1)) || {
            echo "::error::Expected one ISO, found ${#iso[@]}"
            exit 1
          }
          bundle=("$RUNNER_TEMP"/bundle/*)
          if ((${#bundle[@]} != 1)) || [[ ! -f ${bundle[0]} ]]; then
            echo "::error::Expected one signature bundle, found ${#bundle[@]}"
            exit 1
          fi
          args=(--version "$VERSION" --iso "${iso[0]}" --bundle "${bundle[0]}" --prerelease --skip-checks)
          [[ -z $NOTES ]] || args+=(--notes "$NOTES")
          scripts/lyona-release "${args[@]}"
