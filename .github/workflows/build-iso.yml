name: Build ISO and release

# Builds the ISO, then creates the release tag and the GitHub release for the
# committed config.mk VERSION through scripts/lyona-release: the source archive
# lyona-update installs from, the ISO, and a SHA256SUMS of both. The tag is
# created at this run's commit, and only after the ISO has built.
#
# - beta: VERSION must carry an -alpha.N, -beta.N or -rc.N suffix. It is
#   published as a pre-release and stays one.
# - main: VERSION must be a plain YYYY.MM.PATCH. It is published as a
#   pre-release, and stays one until promote-releases.yml is run by hand for
#   its tag, once its ISO is qualified (docs/RELEASING.md).
#
# Rerunning for a VERSION already tagged at this commit replaces the assets; a
# VERSION tagged at another commit is refused, so bump config.mk first.
#
# Who can release: only the repository's admins and maintainers (the authorize
# job). The tag is created with RELEASE_TOKEN, an admin's fine-grained token
# kept as a secret of the "release" environment, which only main can use: the
# "Lock Tags" ruleset lets only admins create tags, and the workflow's own
# token is not one (docs/RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel: beta (a pre-release VERSION such as 2026.10.0-beta.1) or main (a stable VERSION such as 2026.10.0)"
        type: choice
        options:
          - beta
          - main
        required: true
      notes:
        description: "Release notes file in the repository (optional, e.g. docs/RELEASE-NOTES-2026.10.0.md)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only the repository's admins and maintainers may release. Whoever started
  # the run is asked about, through the API, so this follows the collaborator
  # list as it changes; anyone else is refused before anything else runs.
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Allow only admins and maintainers
        run: |
          set -euo pipefail
          role=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .role_name) || {
            echo "::error::Could not look up $ACTOR's permission on $GH_REPO."
            exit 1
          }
          case $role in
          admin | maintain) echo "$ACTOR is a repository $role; allowed." ;;
          *)
            echo "::error::Only the repository's admins and maintainers can run this; $ACTOR is a repository ${role:-collaborator of unknown role}."
            exit 1
            ;;
          esac

  build-iso:
    needs: authorize
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:base-devel
      options: --privileged
    # A container job's steps run with sh by default; these use bash's [[ ]],
    # arrays, mapfile and pipefail.
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.event.inputs.channel }}
      NOTES: ${{ github.event.inputs.notes }}
      RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}

    steps:
      # github-cli lands here rather than with the build dependencies below:
      # the version and tag checks run before them, so a bad request fails in
      # seconds instead of after a full archiso install.
      - name: Install checkout and release-query dependencies
        run: pacman -Sy --noconfirm --needed git github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the version and the tag
        run: |
          set -euo pipefail
          version=$(awk -F= '$1 ~ /^[[:space:]]*VERSION[[:space:]]*$/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' config.mk)
          case $CHANNEL in
          beta)
            [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]] || {
              echo "::error::A beta release needs a pre-release VERSION in config.mk (such as 2026.10.0-beta.1); it is $version."
              exit 1
            }
            ;;
          main)
            [[ $version =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]] || {
              echo "::error::A main release needs a stable VERSION in config.mk (such as 2026.10.0); it is $version."
              exit 1
            }
            ;;
          *)
            echo "::error::Unknown channel: $CHANNEL"
            exit 1
            ;;
          esac
          tag=v$version
          head=$(git rev-parse HEAD)
          if tagged=$(gh api "repos/:owner/:repo/commits/$tag" --jq .sha 2>/dev/null); then
            if [[ $tagged != "$head" ]]; then
              echo "::error::$tag already exists at ${tagged:0:12}, not this run's ${head:0:12}. Bump VERSION in config.mk to release again."
              exit 1
            fi
            echo "$tag already points at this commit; its release assets will be replaced."
          fi
          if [[ $RELEASE_TOKEN_SET != true ]]; then
            echo "::error::The release environment has no RELEASE_TOKEN secret; see docs/RELEASING.md."
            exit 1
          fi
          if [[ -n $NOTES && ! -f $NOTES ]]; then
            echo "::error::Release notes file not found: $NOTES"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
          } >>"$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # shellcheck source=scripts/dwm-packages.sh
          . scripts/dwm-packages.sh
          mapfile -t build < <(dwm_packages arch build)
          pacman -Sy --noconfirm --needed archiso rsync "${build[@]}"

      # Outside the checkout: lyona-release requires a clean worktree.
      - name: Build ISO
        run: scripts/build-lyona-arch-iso.sh --output "$RUNNER_TEMP/iso"

      - name: Checksum ISO
        working-directory: ${{ runner.temp }}/iso
        run: sha256sum ./*.iso > SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyona-iso-${{ env.TAG }}
          path: |
            ${{ runner.temp }}/iso/*.iso
            ${{ runner.temp }}/iso/SHA256SUMS

      # Every release starts as a pre-release: a beta stays one, and a main
      # release stays one until promote-releases.yml is run for it.
      # With the admin's token: the "Lock Tags" ruleset lets only admins create tags.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          iso=("$RUNNER_TEMP"/iso/*.iso)
          ((${#iso[@]} == 1)) || {
            echo "::error::Expected one ISO, found ${#iso[@]}"
            exit 1
          }
          args=(--version "$VERSION" --iso "${iso[0]}" --prerelease)
          [[ -z $NOTES ]] || args+=(--notes "$NOTES")
          scripts/lyona-release "${args[@]}"
