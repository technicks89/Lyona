#
# /etc/pacman.conf for the lyona aarch64 archiso build
#
# Arch Linux ARM's repositories (ARM2-02). archiso's releng profile names Arch
# Linux's, whose aarch64 port has no public repositories yet
# (docs/evidence/arm2-01-spike.md). Arch Linux ARM has no [multilib].

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
# For the image build (mkarchiso -C), as archiso/pacman.conf.
ParallelDownloads = 10

Color
ILoveCandy

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
