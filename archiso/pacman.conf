#
# /etc/pacman.conf for the lyona archiso build
#
# Copied from archiso's releng profile. See the pacman.conf(5) manpage for
# option and repository directives. [multilib] is enabled here because
# archinstall copies this file onto the installed system, and the full
# profile the ISO installs needs it for the 32-bit gaming packages.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5

# archinstall copies this file onto the installed system, so these apply to
# the live medium and to pacman and yay on the installed machine alike.
Color
ILoveCandy

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
