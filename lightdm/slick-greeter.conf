[Greeter]
# ── Background ───────────────────────────────────────────
# Wallpaper installed by 'sudo make install'
background=/usr/share/pixmaps/lyona.jpg
# Tokyo Night background shown while the wallpaper loads
background-color=#1A1B26
# Span wallpaper across all monitors instead of repeating
stretch-background-across-monitors=true
# Subtle dot-grid overlay for depth
draw-grid=true
# Don't replace wallpaper with per-user images
draw-user-backgrounds=false

# ── Logo ─────────────────────────────────────────────────
logo=/usr/share/pixmaps/lyona-logo.png
# Shown on every monitor that is not the login one
other-monitors-logo=/usr/share/pixmaps/lyona-logo.png

# ── Login panel ──────────────────────────────────────────
# Centre the login box on screen
content-align=center
# Tokyo Night recolour of Adwaita dark, installed by 'sudo make install'
theme-name=Lyona-tokyonight
icon-theme-name=Adwaita

# ── Font & rendering ─────────────────────────────────────
# Uses ttf-meslo-nerd (installed by install.sh)
font-name=MesloLGS NF 12
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
xft-dpi=96

# ── Clock ────────────────────────────────────────────────
show-clock=true
clock-format=%a, %b %d   %H:%M

# ── Panel items ──────────────────────────────────────────
# Session chooser reads /usr/share/xsessions automatically
show-hostname=true
show-power=true
show-a11y=false
show-keyboard=false
show-quit=true

# ── Misc ─────────────────────────────────────────────────
enable-hidpi=auto
# Keep this disabled by default so the greeter does not depend on numlockx.
activate-numlock=false
